name: InkYomi
options:
  bundleIdPrefix: shop.inkcolors
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    # Recommended-settings opt-ins (Xcode 15/16). Mirroring what
    # Xcode's "Validate Project Settings" dialog suggests — declared
    # here so they survive `xcodegen generate`.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

packages:
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.0.0"
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    from: "3.0.1"
  ReadiumSwift:
    url: https://github.com/readium/swift-toolkit.git
    from: "3.1.0"
  # OAuth 2.0 client (Authorization Code + PKCE) used by
  # KeycloakAuthRepository for the device-bound reader login. Wraps
  # ASWebAuthenticationSession + OIDAuthState refresh under the
  # hood. Picked over hand-rolled PKCE because it handles redirect
  # parsing, JWKS discovery, and refresh-token rotation correctly.
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: "1.7.0"

targets:
  InkYomi:
    type: application
    platform: iOS
    sources:
      - InkYomi
    resources:
      - path: InkYomi/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: InkYomi/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: shop.inkcolors.InkYomi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    dependencies:
      - package: Nuke
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
      - package: ReadiumSwift
        product: ReadiumShared
      - package: ReadiumSwift
        product: ReadiumStreamer
      - package: ReadiumSwift
        product: ReadiumNavigator
      - package: AppAuth
        product: AppAuth

  InkYomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InkYomiTests
    dependencies:
      - target: InkYomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shop.inkcolors.InkYomiTests
        # Let Xcode synthesize the test bundle's Info.plist; we don't
        # carry one in the repo. Without this, `xcodebuild test` fails
        # with: "target does not have an Info.plist file and one is
        # not being generated automatically."
        GENERATE_INFOPLIST_FILE: "YES"
